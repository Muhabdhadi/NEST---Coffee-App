version: "3"
services:
  db:
    image:  postgres:16
    restart: always 
    ports:
      - "5432:5432"
    environment:
        POSTGRES_PASSWORD: pass123
        POSTGRES_USER: coffee
        POSTGRES_DB: coffee_db
    volumes:
      - pgdata:/var/lib/postgresql/data

      
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  pgdata:

  